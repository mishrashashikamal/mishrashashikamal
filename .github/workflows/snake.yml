name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write           # required so the action can push to the "output" branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation (magenta snake, red dots)
        uses: Platane/snk@v3
        with:
          github_user_name: mishrashashikamal
          outputs: |
            dist/snake-dots.svg?color_snake=#FF2EC4&color_dots=#0D1117,#3d0d0d,#7a1414,#c11f1f,#ff3b3b
            dist/snake-dots-dark.svg?palette=github-dark&color_snake=#FF2EC4&color_dots=#0D1117,#3d0d0d,#7a1414,#c11f1f,#ff3b3b

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
