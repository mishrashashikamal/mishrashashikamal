name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write           # required so the action can push to the "output" branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation (colored dots, cyan/blue palette)
        uses: Platane/snk@v3
        with:
          github_user_name: mishrashashikamal
          outputs: |
            dist/snake-dots.svg?color_snake=#00D9FF&color_dots=#0D1117,#003b46,#007b8a,#00c2d1,#00fff7
            dist/snake-dots-dark.svg?palette=github-dark&color_snake=#7000FF&color_dots=#0D1117,#1a1a3d,#3d1a6b,#5e1ab8,#7000ff

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
